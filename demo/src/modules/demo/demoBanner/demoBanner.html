<template>
    <div class="banner">
        <!-- ------------------------------------------------ Expanded introduction -->
        <template lwc:if={expanded}>
            <div class="intro">
                <div class="intro-top">
                    <div>
                        <span class="badge">Portfolio demo &middot; not a live Salesforce org</span>
                        <h1 class="title">Salesforce Consent &amp; Preference Center</h1>
                        <p class="byline">
                            Built by David Zernik &mdash; Salesforce &amp; marketing technology architect, Los Angeles
                        </p>
                    </div>
                    <div class="banner-links">
                        <button class="link-button" onclick={handleViewSource}>Browse the source</button>
                        <a class="link-button" href={repoUrl} target="_blank" rel="noopener noreferrer">GitHub repo</a>
                        <a class="link-button" href={portfolioUrl} target="_blank" rel="noopener noreferrer">
                            davidz-losangeles.com
                        </a>
                    </div>
                </div>

                <div class="cols">
                    <section class="col">
                        <h2 class="col-title">Who I am</h2>
                        <p>
                            A Salesforce and marketing technology architect in Los Angeles, nine years on the
                            platform.
                        </p>
                    </section>

                    <section class="col">
                        <h2 class="col-title">How it works</h2>
                        <p>
                            A working Salesforce app you can click through right here, with no Salesforce
                            login. The screens are built in Lightning Web Components, Salesforce's own
                            framework, and these exact files would run inside a real Salesforce org.
                        </p>
                    </section>

                    <section class="col">
                        <h2 class="col-title">What it demonstrates</h2>
                        <p>
                            My ability to code with Apex, LWC, SOQL, SOSL, Visualforce, Flow and metadata
                            XML. Plus REST and SOAP integrations, OAuth, and Data Cloud.
                        </p>
                    </section>
                </div>

                <div class="intro-foot">
                    <span class="hint">
                        Apex only runs inside a Salesforce org, so the browser serves the same JSON from a
                        mock. The Apex is real, deployable source. Read all of it in the source browser.
                    </span>
                    <button class="toggle" onclick={handleToggle}>Hide this introduction</button>
                </div>
            </div>
        </template>

        <!-- --------------------------------------------------- Collapsed one-liner -->
        <template lwc:else>
            <div class="banner-inner">
                <div class="banner-text">
                    <span class="headline">Salesforce Consent &amp; Preference Center</span>
                    <span class="sub">Portfolio demo by David Zernik. Real LWC and Apex.</span>
                    <button class="toggle" onclick={handleToggle}>Read the introduction</button>
                </div>
                <div class="banner-links">
                    <button class="link-button" onclick={handleViewSource}>View source</button>
                    <a class="link-button" href={repoUrl} target="_blank" rel="noopener noreferrer">GitHub</a>
                    <a class="link-button" href={portfolioUrl} target="_blank" rel="noopener noreferrer">
                        davidz-losangeles.com
                    </a>
                </div>
            </div>
        </template>
    </div>
</template>
